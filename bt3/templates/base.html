<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ shop.name }}{% endblock %}</title>

    {% block styles %}
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f8f9fa; color: #333; display: flex; flex-direction: column; min-height: 100vh; }
        nav { background-color: #2c3e50; padding: 15px; text-align: center; }
        nav a { color: #ffffff; text-decoration: none; margin: 0 15px; font-weight: 600; font-size: 16px; }
        nav a:hover { color: #f39c12; }
        .container { padding: 30px 20px; flex: 1; max-width: 800px; margin: 0 auto; width: 100%; }
        footer { background-color: #2c3e50; color: #ffffff; text-align: center; padding: 15px; margin-top: auto; }
    </style>
    {% endblock %}
</head>
<body>

    <nav>
        <a href="/">Trang chủ</a>
        <a href="/menu">Thực đơn</a>
        <a href="/contact">Liên hệ</a>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>© 2026 {{ shop.name }} - Địa chỉ: {{ shop.address }}</p>
    </footer>

</body>
</html>
