<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ shop.name }}{% endblock %}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f3ede6;
      color: #333;
    }
    nav {
      background-color: #6f4e37;
      padding: 0 30px;
      display: flex;
      align-items: center;
    }
    .brand {
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      margin-right: 30px;
      padding: 14px 0;
    }
    nav a {
      color: #f3ede6;
      text-decoration: none;
      padding: 18px 16px;
    }
    nav a:hover {
      background-color: #5a3e2b;
    }
    nav a.active {
      background-color: #4a3223;
      font-weight: bold;
    }
    main {
      max-width: 800px;
      margin: 30px auto;
      padding: 25px 30px;
      background-color: #fff;
      border: 1px solid #ddd;
    }
    h1 {
      color: #6f4e37;
      margin-top: 0;
      border-bottom: 2px solid #6f4e37;
      padding-bottom: 8px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background-color: #6f4e37;
      color: #fff;
    }
    tr:nth-child(even) td {
      background-color: #faf6f1;
    }
    form div {
      margin-bottom: 12px;
    }
    label {
      display: inline-block;
      width: 120px;
    }
    input[type="text"], select {
      padding: 6px 8px;
      border: 1px solid #aaa;
      font-size: 15px;
    }
    button {
      padding: 8px 22px;
      background-color: #6f4e37;
      color: #fff;
      border: none;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background-color: #5a3e2b;
    }
    .error {
      color: red;
      margin-left: 8px;
    }
    .out {
      color: red;
    }
    footer {
      background-color: #6f4e37;
      color: #f3ede6;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <nav>
    <span class="brand">{{ shop.name }}</span>
    <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Trang chủ</a>
    <a href="{{ url_for('menu') }}" class="{{ 'active' if request.endpoint == 'menu' }}">Menu</a>
    <a href="{{ url_for('contact') }}" class="{{ 'active' if request.endpoint == 'contact' }}">Liên hệ</a>
    <a href="{{ url_for('calc') }}" class="{{ 'active' if request.endpoint == 'calc' }}">Máy tính</a>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div>{{ shop.name }} - {{ shop.address }}</div>
    <div>ĐT: {{ shop.phone }} | Email: {{ shop.email }}</div>
  </footer>
</body>
</html>
